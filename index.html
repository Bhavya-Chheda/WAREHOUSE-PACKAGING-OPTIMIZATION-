<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warehouse Box Packing – First Fit Decreasing</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14213d;--muted:#5b6678;--line:#d3d9e1;--accent:#f2b705;--accent-ink:#14213d;--bad:#c0392b;--track:#e3e8ee;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--panel:#18223a;--ink:#e8edf5;--muted:#9aa7bd;--line:#2b3957;--accent:#f2b705;--accent-ink:#14213d;--bad:#ff7b6b;--track:#222f4d}}
:root[data-theme="dark"]{--bg:#0f1624;--panel:#18223a;--ink:#e8edf5;--muted:#9aa7bd;--line:#2b3957;--accent:#f2b705;--accent-ink:#14213d;--bad:#ff7b6b;--track:#222f4d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:34px;line-height:1.1;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
h2{font-size:21px;margin:0 0 12px;font-weight:600}
label{display:block;font-weight:600;margin-bottom:4px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.rows{margin-top:14px}
.row{display:grid;grid-template-columns:26px 1fr 80px 34px;gap:8px;align-items:center;margin-bottom:8px}
.row .n{color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;height:36px;cursor:pointer;font-size:18px}
.x:hover{color:var(--bad);border-color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button.b{font:inherit;font-weight:600;border-radius:6px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button.b:hover{border-color:var(--ink)}
button.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.b:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--bad);font-weight:600;margin-top:10px;min-height:1.3em}
.empty{color:var(--muted);padding:26px 0;text-align:center}
.sorted{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.chip{padding:3px 10px;border-radius:999px;color:#fff;font-weight:600;font-size:15px}
.arrow{color:var(--muted)}
.box{margin-top:14px}
.boxhead{display:flex;justify-content:space-between;font-weight:600;margin-bottom:5px}
.track{display:flex;height:46px;background:var(--track);border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap;border-right:2px solid var(--panel);transition:width .35s}
.seg.new{animation:pop .5s}
@keyframes pop{from{filter:brightness(1.7)}to{filter:none}}
@media(prefers-reduced-motion:reduce){.seg,.seg.new{transition:none;animation:none}}
.log{max-height:230px;overflow:auto;margin-top:6px;border-top:1px solid var(--line)}
.log div{padding:7px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.log b.new{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat span{display:block;color:var(--muted);font-size:15px}
.stat strong{font-size:26px;font-variant-numeric:tabular-nums}
.stat.hi{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.hi span{color:var(--accent-ink)}
table{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.stack>*+*{margin-top:20px}
.tag{font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Warehouse Box Packaging Optimization</h1>
  <p class="sub">First Fit Decreasing (greedy): sort products heaviest first, then put each one in the first box with room.</p>

  <div class="grid">
    <section class="panel" aria-label="Input">
      <h2>Input</h2>
      <label for="cap">Box capacity (kg)</label>
      <input id="cap" type="number" min="1" placeholder="e.g. 10" inputmode="numeric">
      <div class="rows" id="rows"></div>
      <div class="btns">
        <button class="b" id="add">Add product</button>
        <button class="b" id="clear">Clear all</button>
      </div>
      <div class="btns">
        <button class="b p" id="run">Run packing</button>
      </div>
      <div class="err" id="err" role="alert"></div>
    </section>

    <div class="stack" id="out">
      <section class="panel"><div class="empty">Enter capacity and products, then press Run packing.</div></section>
    </div>
  </div>
</div>

<script>
var COLORS=["#2a6f97","#c05621","#2f855a","#8e44ad","#b83280","#718096","#b7791f","#0f766e","#c0392b","#4a5fc1"];
var products=[],steps=[],sorted=[],shown=0,cap=0,stepping=false;

var $=function(id){return document.getElementById(id)};

function renderRows(){
  var h="";
  products.forEach(function(p,i){
    h+='<div class="row"><span class="n">'+(i+1)+'</span>'+
      '<input aria-label="Product '+(i+1)+' name" data-i="'+i+'" data-f="name" value="'+esc(p.name)+'" placeholder="Name">'+
      '<input aria-label="Product '+(i+1)+' weight" data-i="'+i+'" data-f="weight" type="number" min="1" value="'+p.weight+'" placeholder="kg">'+
      '<button class="x" data-del="'+i+'" aria-label="Remove product '+(i+1)+'">×</button></div>';
  });
  $("rows").innerHTML=h||'<div class="tag"></div>';
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}

$("rows").addEventListener("input",function(e){
  var t=e.target,i=t.getAttribute("data-i");if(i===null)return;
  products[i][t.getAttribute("data-f")]=t.value;
});
$("rows").addEventListener("click",function(e){
  var d=e.target.getAttribute("data-del");
  if(d!==null){products.splice(+d,1);renderRows();}
});
function addProduct(){
  if(products.length>=100){$("err").textContent="Maximum 100 products.";return}
  products.push({name:"",weight:""});renderRows();
  var f=document.querySelector('[data-i="'+(products.length-1)+'"][data-f="name"]');if(f)f.focus();
}
$("add").onclick=addProduct;
$("rows").addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  var t=e.target,i=t.getAttribute("data-i");if(i===null)return;
  e.preventDefault();i=+i;
  if(t.getAttribute("data-f")==="name"){
    var w=document.querySelector('[data-i="'+i+'"][data-f="weight"]');if(w)w.focus();
  }else if(t.value===""){return}
  else if(i===products.length-1){addProduct()}
  else{var nx=document.querySelector('[data-i="'+(i+1)+'"][data-f="name"]');if(nx)nx.focus()}
});
$("cap").addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  e.preventDefault();
  if(products.length){document.querySelector('[data-f="name"]').focus()}else{addProduct()}
});
$("clear").onclick=function(){products=[];steps=[];renderRows();$("err").textContent="";$("out").innerHTML='<section class="panel"><div class="empty">Enter capacity and products, then press Run packing.</div></section>';};

function validate(){
  cap=parseInt($("cap").value,10);
  if(!(cap>0))return "Invalid box capacity.";
  if(products.length<=0||products.length>100)return "Invalid number of products (1 to 100).";
  for(var i=0;i<products.length;i++){
    var p=products[i],w=parseInt(p.weight,10);
    if(!String(p.name).trim())return "Product "+(i+1)+" needs a name.";
    if(!(w>0))return "Product "+(i+1)+": invalid product weight.";
    if(w>cap)return "Product "+(i+1)+": weight cannot exceed box capacity.";
  }
  return "";
}

function solve(){
  var e=validate();$("err").textContent=e;if(e)return false;
  sorted=products.map(function(p,i){return{id:i+1,name:String(p.name).trim().replace(/\s+/g,"_"),weight:parseInt(p.weight,10),c:COLORS[i%COLORS.length]}});
  sorted.sort(function(a,b){return b.weight-a.weight});
  var used=[];steps=[];
  sorted.forEach(function(p,i){
    var j,placed=false;
    for(j=0;j<used.length;j++){
      if(used[j]+p.weight<=cap){used[j]+=p.weight;placed=true;break}
    }
    if(!placed){used.push(p.weight);j=used.length-1}
    steps.push({p:p,box:j,isNew:!placed,used:used[j],n:i+1});
  });
  return true;
}

function render(){
  var upto=steps.slice(0,shown),boxes=[];
  upto.forEach(function(s){(boxes[s.box]=boxes[s.box]||[]).push(s)});
  var h='<section class="panel"><h2>Greedy packing process</h2><div class="tag">Products after sorting by weight</div><div class="sorted">';
  sorted.forEach(function(p,i){h+='<span class="chip" style="background:'+p.c+'">'+esc(p.name)+' '+p.weight+' kg</span>'+(i<sorted.length-1?'<span class="arrow">›</span>':'')});
  h+='</div>';
  h+='<div class="log" id="log">';
  upto.forEach(function(s){
    h+='<div>Step '+s.n+': '+esc(s.p.name)+' ('+s.p.weight+' kg) → '+(s.isNew?'<b class="new">NEW Box '+(s.box+1)+'</b>':'Box '+(s.box+1))+' &nbsp; <span class="tag">Box '+(s.box+1)+' capacity: '+s.used+' / '+cap+' kg</span></div>';
  });
  h+='</div></section>';

  if(boxes.length){
    h+='<section class="panel"><h2>Packaging result</h2>';
    boxes.forEach(function(b,bi){
      var u=b.reduce(function(a,s){return a+s.p.weight},0);
      h+='<div class="box"><div class="boxhead"><span>Box '+(bi+1)+'</span><span>'+u+' / '+cap+' kg &nbsp;·&nbsp; remaining '+(cap-u)+' kg</span></div><div class="track">';
      b.forEach(function(s){
        var last=upto[upto.length-1]===s;
        h+='<div class="seg'+(last?' new':'')+'" style="width:'+(s.p.weight/cap*100)+'%;background:'+s.p.c+'" title="'+esc(s.p.name)+' – '+s.p.weight+' kg">'+esc(s.p.name)+' '+s.p.weight+'</div>';
      });
      h+='</div><div class="scroll"><table><tr><th>ID</th><th>Product</th><th>Weight</th></tr>';
      b.forEach(function(s){h+='<tr><td>'+s.p.id+'</td><td>'+esc(s.p.name)+'</td><td>'+s.p.weight+' kg</td></tr>'});
      h+='</table></div></div>';
    });
    h+='</section>';
  }

  if(shown>=steps.length&&steps.length){
    var nb=boxes.length,tc=nb*cap,tu=sorted.reduce(function(a,p){return a+p.weight},0);
    h+='<section class="panel"><h2>Final analysis</h2><div class="stats">'+
      st("Total products",sorted.length)+st("Boxes used",nb)+st("Total capacity",tc+" kg")+st("Used capacity",tu+" kg")+st("Unused capacity",(tc-tu)+" kg")+
      '<div class="stat hi"><span>Space utilization</span><strong>'+(tu/tc*100).toFixed(2)+'%</strong></div></div></section>';
  }
  $("out").innerHTML=h;
}
function st(a,b){return '<div class="stat"><span>'+a+'</span><strong>'+b+'</strong></div>'}

$("run").onclick=function(){if(!solve())return;stepping=false;shown=steps.length;render()};

renderRows();
</script>
</body>
</html>
